<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lathe harness</title>
    <style>
      :root {
        color-scheme: dark;
        --lacquer-0: #07060a;
        --lacquer-2: #16131c;
        --groove: #332d3e;
        --paper: #efe7d6;
        --clay: #e27c5c;
        --clay-ink: #2a120a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--lacquer-0);
        overflow: hidden;
      }
      .room {
        display: grid;
        height: 100dvh;
        grid-template-rows: 56px 1fr 72px;
        grid-template-columns: minmax(320px, 400px) 1fr minmax(280px, 340px);
      }
      .bar {
        grid-column: 1 / -1;
        border-bottom: 1px solid var(--groove);
      }
      .dock {
        grid-column: 1 / -1;
        border-top: 1px solid var(--groove);
        display: grid;
        place-items: center;
      }
      #unlock {
        font: 600 14px 'JetBrains Mono Variable', monospace;
        color: var(--clay-ink);
        background: var(--clay);
        border: 0;
        border-radius: 6px;
        padding: 12px 20px;
      }
      .rail {
        background: var(--lacquer-0);
        border-right: 1px solid var(--groove);
      }
      .rail:last-of-type {
        border-right: 0;
        border-left: 1px solid var(--groove);
      }
      .record {
        position: relative;
        min-width: 0;
        min-height: 0;
      }
      .record canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* The track title is DOM over the paper label: crisp, never rotating. */
      .label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        text-align: center;
        pointer-events: none;
        color: #1c140d;
        font-family: 'Anybody Variable', sans-serif;
      }
      .label .side {
        font: 600 10px/1 'JetBrains Mono Variable', monospace;
        letter-spacing: 0.3em;
        color: #7a5a40;
      }
      .label .title {
        font-weight: 800;
        font-stretch: 72%;
        line-height: 0.95;
        text-transform: uppercase;
        margin: 6px 0 4px;
      }
      .label .by {
        font: italic 400 13px/1 'Newsreader Variable', serif;
        color: #6e4c34;
      }
      .label.inverted .title,
      .label.inverted .by,
      .label.inverted .side {
        color: var(--clay-ink);
      }
      @media (max-width: 819px) {
        .room {
          grid-template-columns: 1fr;
          grid-template-rows: 56px min(100vw, 52dvh) 1fr 72px;
        }
        .rail {
          display: none;
        }
        .below {
          display: block !important;
          border-top: 1px solid var(--groove);
        }
      }
      .below {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="room">
      <div class="bar"></div>
      <aside class="rail"></aside>
      <main class="record">
        <canvas id="lathe" aria-hidden="true"></canvas>
        <div class="label" id="label">
          <span class="side">SIDE B</span>
          <span class="title" id="title">Glass Harbour</span>
          <span class="by">Claude · live</span>
        </div>
      </main>
      <aside class="rail"></aside>
      <div class="below"></div>
      <div class="dock"><button id="unlock" hidden>Drop the needle</button></div>
    </div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
