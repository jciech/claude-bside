<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0f0f0f"/>

  <!-- Vinyl record with off-center hole (the B-side) -->
  <g transform="translate(50, 50)">
    <!-- Record grooves -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#242220" stroke-width="1"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#242220" stroke-width="1"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#242220" stroke-width="1"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#242220" stroke-width="1"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#242220" stroke-width="1"/>

    <!-- Label area -->
    <circle cx="0" cy="0" r="16" fill="#1a1918"/>

    <!-- Off-center spindle hole - the quirky "B-side" touch -->
    <circle cx="4" cy="-2" r="4" fill="#d97757"/>

    <!-- Sound wave emanating -->
    <path
      d="M 24 -28 Q 34 -18, 34 0 Q 34 18, 24 28"
      fill="none"
      stroke="url(#glow)"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.8"
    />
    <path
      d="M 30 -22 Q 38 -12, 38 0 Q 38 12, 30 22"
      fill="none"
      stroke="url(#glow)"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.5"
    />
  </g>
</svg>